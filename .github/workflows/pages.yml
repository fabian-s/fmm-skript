name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # Vier Deployments in Folge sind am 10-Minuten-Standard gescheitert,
          # jedes Mal mit „Current status: deployment_queued" bis zum Abbruch.
          # Der Artefakt-Upload war jeweils sauber (1 Artefakt, korrekte ID) —
          # der Pages-Dienst hat die Ablieferung nur nicht abgeschlossen.
          # 30 Minuten unterscheiden „langsam" von „hängt": läuft es auch damit
          # ab, liegt es nicht am Zeitlimit.
          timeout: 1800000
